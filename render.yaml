# Render Blueprint — optional shortcut for the manual setup in docs/RENDER_DEPLOY.md
#
# Render's Blueprint YAML schema can change over time and this hasn't been
# validated against a live Render deploy from this environment. If "New +
# Blueprint" in the Render dashboard doesn't pick this up cleanly or a field
# is rejected, fall back to the manual dashboard steps in
# docs/RENDER_DEPLOY.md (section 2-3) — they're the reliable path and don't
# depend on this file's schema being current. Cross-check against Render's
# own Blueprint docs if in doubt.
#
# Secrets (DATABASE_URL, BREVO_API_KEY, BREVO_WEBHOOK_SECRET, CRON_SECRET)
# are deliberately left as `sync: false` — Render will prompt you to fill
# them in via the dashboard rather than storing them in this file.

services:
  - type: web
    name: campaign-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ""  # Render auto-adds RENDER_EXTERNAL_HOSTNAME; see config/settings.py
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_WEBHOOK_SECRET
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BACKEND_BASE_URL
        sync: false  # set to this service's own https://... URL once known
      - key: FRONTEND_URL
        sync: false  # set to the static site's URL once known
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # same as FRONTEND_URL
      - key: TIME_ZONE
        value: "Asia/Karachi"
      - key: CRON_SECRET
        sync: false

  - type: web
    name: campaign-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # set to https://campaign-backend.onrender.com/api once known
